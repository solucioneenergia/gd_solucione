[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automacao-gd-neoenergia"
version = "2.0.2"
description = "Automação assistida para solicitações GD Neoenergia, PDFs, Excel e arquivamento."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "Proprietary"}
authors = [{name = "Equipe do projeto"}]
dynamic = ["dependencies"]

[project.scripts]
gd-neoenergia = "automacao_gd.presentation.cli:main"
gd-neoenergia-desktop = "desktop_app:main"

[tool.setuptools]
include-package-data = true
py-modules = ["app", "desktop_app"]

[tool.setuptools.packages.find]
where = ["."]
include = ["automacao_gd*", "apps*", "src*", "scripts*"]

[tool.setuptools.package-data]
"apps.desktop" = [
  "resources/*.ico",
  "resources/*.svg",
  "frontend/dist/*.html",
  "frontend/dist/assets/*",
  "frontend/static/*.html",
  "frontend/static/*.css",
  "frontend/static/*.js",
  "frontend/static/assets/icons/*.svg",
  "frontend/static/assets/images/*.png",
  "frontend/static/assets/images/*.svg",
  "frontend/static/assets/images/*.webp",
]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: testes que acessam arquivos reais ou infraestrutura externa",
  "e2e: testes que exigem navegador e Portal GD",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["automacao_gd/infrastructure/portal/cdp_service.py", "automacao_gd/infrastructure/excel/service.py"]
