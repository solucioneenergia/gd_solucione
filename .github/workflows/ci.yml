name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/frontend/pnpm-lock.yaml
      - name: Install Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Install frontend
        working-directory: apps/desktop/frontend
        run: pnpm install --frozen-lockfile
      - name: Test frontend
        working-directory: apps/desktop/frontend
        run: pnpm test
      - name: Build frontend
        working-directory: apps/desktop/frontend
        run: pnpm build
      - name: Compile
        run: python -m compileall -q automacao_gd apps src scripts tests app.py desktop_app.py
      - name: Static fatal checks
        run: python -m ruff check automacao_gd apps src scripts tests
      - name: Type checking
        run: python -m mypy automacao_gd
      - name: Validate engineering foundation
        run: python scripts/validate_engineering_foundation.py
      - name: Privacy scan source tree and frontends
        run: python scripts/privacy_scan.py . automacao_gd apps tests scripts src frontend specs docs .agents .github AGENTS.md README.md CHANGELOG.md pyproject.toml requirements.txt requirements-dev.txt desktop_app.py app.py start_desktop_app_silent.ps1
      - name: Tests
        run: python -m pytest -q --cov=automacao_gd --cov-report=term-missing
      - name: Dependency audit
        run: python -m pip_audit -r requirements.txt

  package-and-release:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/desktop/frontend/pnpm-lock.yaml
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Build canonical frontend
        working-directory: apps/desktop/frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm build
      - name: Privacy scan source tree and frontends
        run: python scripts/privacy_scan.py . .
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir "${RUNNER_TEMP}/wheelhouse"
      - name: Privacy scan wheel
        run: python scripts/privacy_scan.py "${RUNNER_TEMP}/wheelhouse" .
      - name: Installed desktop smoke test
        run: |
          python -m venv "${RUNNER_TEMP}/smoke-venv"
          "${RUNNER_TEMP}/smoke-venv/bin/python" -m pip install --no-deps "${RUNNER_TEMP}"/wheelhouse/*.whl
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/smoke-venv/bin/python" -I -c "import desktop_app; import apps.desktop"
      - name: Release validator tests
        run: python -m pytest -q tests/test_release_validator_hardening.py tests/test_migration_and_release.py -k release
      - name: Build and validate clean release
        run: |
          EXPECTED_HEAD_SHA="$(git rev-parse HEAD)"
          python scripts/create_clean_release_zip.py --project-root . --output "${RUNNER_TEMP}/gd-neoenergia-2.0.2.zip"
          python scripts/privacy_scan.py "${RUNNER_TEMP}" gd-neoenergia-2.0.2.zip
          python scripts/validate_release_zip.py "${RUNNER_TEMP}/gd-neoenergia-2.0.2.zip" --reports-dir "${RUNNER_TEMP}/release-reports" --expected-head-sha "${EXPECTED_HEAD_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-release-validation
          path: ${{ runner.temp }}/release-reports/

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITLEAKS_VERSION: "8.30.1"
