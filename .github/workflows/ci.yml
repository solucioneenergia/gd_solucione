name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q automacao_gd src scripts tests
      - name: Static fatal checks
        run: ruff check automacao_gd src scripts tests
      - name: Validate engineering foundation
        run: python scripts/validate_engineering_foundation.py
      - name: Tests
        run: pytest -q --cov=automacao_gd --cov-report=term-missing
      - name: Dependency audit
        run: pip-audit -r requirements.txt
